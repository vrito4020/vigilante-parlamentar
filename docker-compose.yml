version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vigilante_backend
    restart: unless-stopped
    volumes:
      - ./backend/vigilante.db:/app/vigilante.db
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vigilante_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
