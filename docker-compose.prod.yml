version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vigilante_backend
    restart: unless-stopped
    volumes:
      - ./backend/vigilante.db:/app/vigilante.db
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vigilante_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default
      - coolify

networks:
  default:
  coolify:
    external: true
